# ─────────────────────────────────────────────────────────────
# 扫码挪车（PHP 版）Nginx 伪静态规则
# 宝塔面板：网站 → 设置 → 伪静态 → 粘贴以下内容 → 保存
# 前提：网站「运行目录」已设置为 /public（见 README 与 docs/宝塔部署.md）
# ─────────────────────────────────────────────────────────────

# 隐藏 PHP 版本
fastcgi_hide_header X-Powered-By;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP 解析（宝塔默认已生成，这里仅为完整性展示）
location ~ \.php(?:$|/) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass  unix:/tmp/php-cgi-82.sock;   # ← 按你的 PHP 版本改：php-cgi-74 / 81 / 82 / 83
    fastcgi_index index.php;
    include       fastcgi.conf;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
}

# 静态资源缓存
location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
}

# ⚠️ 切勿为 qr.php 单独建 location 块！
# 旧版本曾提供 location = /qr.php { fastcgi... } 特殊块，实践证明：
# 该块在宝塔伪静态里一旦 fastcgi 链没配好，nginx 会退化为把 PHP 源码
# 当静态文件返回（application/octet-stream + 缓存一天），二维码直接不显示。
# qr.php 由上方 location ~ \.php 统一执行即可，缓存策略由 PHP 侧
# 自己发 Cache-Control: no-store 控制，无需 nginx 介入。
