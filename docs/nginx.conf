# ─────────────────────────────────────────────────────────────
# 扫码挪车（PHP 版）Nginx 伪静态规则
# 宝塔面板：网站 → 设置 → 伪静态 → 粘贴以下内容 → 保存
# 前提：网站「运行目录」已设置为 /public（见 README 与 docs/宝塔部署.md）
# ─────────────────────────────────────────────────────────────

# 隐藏 PHP 版本
fastcgi_hide_header X-Powered-By;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP 解析（宝塔默认已生成，这里仅为完整性展示）
location ~ \.php(?:$|/) {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass  unix:/tmp/php-cgi-82.sock;   # ← 按你的 PHP 版本改：php-cgi-74 / 81 / 82 / 83
    fastcgi_index index.php;
    include       fastcgi.conf;
    include       fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
}

# 静态资源缓存
location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
}

# 二维码接口不缓存（内容随 text 变化）
location = /qr.php {
    include       fastcgi.conf;
    include       fastcgi_params;
    fastcgi_pass  unix:/tmp/php-cgi-82.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    add_header Cache-Control "public, max-age=86400";
}
